<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fastshot — Describe an app. We'll build it.</title>
  <meta name="description" content="Fastshot turns a written description into a working app.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block" rel="stylesheet">
  <script>
    document.documentElement.classList.add('anim');
  </script>
  <style>
    /* RESET */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button, input, textarea { font: inherit; color: inherit; background: none; border: 0; }
    img, svg { display: block; }
    html, body { height: 100%; overflow: hidden; }

    /* FONTS & ROOT TOKENS */
    :root {
      --font-text: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-display: Inter, var(--font-text);

      /* REFERENCE LAYOUT (DESKTOP) 1560 × 1008 */
      --u: min(0.06410256vw, 0.12400794vh);
      --vu: 0.09920635vh;
      --inset-top: 41;
      --inset-bottom: 106;

      /* Nav */
      --brand-x: 225; --brand-y: 45; --mark: 34; --brand-gap: 12; --brand-fs: 18.49;
      --links-y: 50.5; --links-gap: 50; --links-fs: 21.69;
      --cta-x: 1195; --cta-y: 42; --cta-w: 140; --cta-h: 43; --cta-r: 12; --cta-fs: 15.70; --cta-dy: 2;

      /* Hero */
      --hero-gap: 51;
      --h1-y: 323; --h1-fs: 36.25; --display-ls: 0.0018em;
      --nav-ls: -0.0115em; --brand-ls: -0.0154em; --cta-ls: -0.0127em; --body-ls: 0.007em;
      --label-ls: normal; --model-ls: normal; --proof-ls: 0.0065em;

      --w-regular: 400; --w-display-wght: 410; --w-medium: 500; --w-semibold: 600;
      --w-display: var(--w-display-wght); --w-nav: 400; --w-brand: 500; --w-cta: 520;
      --w-body: var(--w-regular); --w-label: var(--w-medium);
      --w-model: var(--w-regular); --w-proof: 480;

      /* Composer */
      --card-x: 425; --card-y: 413; --card-w: 708; --card-h: 143; --card-r: 26;
      --ph-x: 452; --ph-y: 446; --ph-fs: 9.97;
      --chips-x: 444; --chips-y: 505; --chip-h: 30; --chip-r: 9; --chip-fs: 9.0; --chip-gap: 5.5;
      --son-fs: 10.4; --son-top: 15.5; --chev-gap: 6.2;
      --chev-x: 1013.5; --chev-y: 522.3;
      --att-x: 1043.2; --att-y: 515.1;
      --send-x: 1084; --send-y: 507; --send-d: 35;

      /* Footer */
      --by-y: 799; --by-fs: 14.01; --logo-y: 867; --logo-gap: 62;

      /* Easing */
      --e-primary: cubic-bezier(.16, 1, .3, 1);
      --e-soft: cubic-bezier(.22, 1, .36, 1);
    }

    @supports (height: 100dvh) {
      :root {
        --u: min(0.06410256vw, 0.12400794dvh);
        --vu: 0.09920635dvh;
      }
    }

    @media (min-width: 1561px) {
      :root {
        --inset-top: 27;
        --inset-bottom: 74;
      }
    }

    body {
      font-family: var(--font-text);
      background: #0a0d12;
      color: #fff;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
    }

    :focus-visible {
      outline: 2px solid #F8B285;
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* STAGE & VIDEO */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #0a0d12;
    }

    .stage-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* FRAME */
    .frame {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      padding: calc(var(--inset-top) * var(--vu)) calc(225 * var(--u)) calc(var(--inset-bottom) * var(--vu));
    }

    /* NAV */
    header.nav {
      height: calc(43 * var(--u));
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--brand-gap) * var(--u));
      text-decoration: none;
      color: #fff;
    }

    .mark {
      width: calc(var(--mark) * var(--u));
      height: calc(var(--mark) * var(--u));
    }

    .wordmark {
      font-family: var(--font-display);
      font-size: calc(var(--brand-fs) * var(--u));
      font-weight: var(--w-brand);
      letter-spacing: var(--brand-ls);
      transform: translateY(calc(1 * var(--u)));
      font-variation-settings: "opsz" 32;
      text-shadow: 0 calc(1 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, .30);
    }

    .links {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: calc((50.5 - 41) * var(--u));
      display: flex;
      align-items: center;
      gap: calc(var(--links-gap) * var(--u));
    }

    .links a {
      font-size: calc(var(--links-fs) * var(--u));
      font-weight: var(--w-nav);
      letter-spacing: var(--nav-ls);
      line-height: 1.2;
      color: #fff;
      text-decoration: none;
      text-shadow: 0 calc(1 * var(--u)) calc(12 * var(--u)) rgba(0, 0, 0, .32);
      transition: opacity .18s ease;
    }

    .links a:hover {
      opacity: .72;
    }

    .cta {
      width: calc(var(--cta-w) * var(--u));
      height: calc(var(--cta-h) * var(--u));
      border-radius: calc(var(--cta-r) * var(--u));
      font-size: calc(var(--cta-fs) * var(--u));
      font-weight: var(--w-cta);
      letter-spacing: var(--cta-ls);
      align-self: flex-start;
      margin-top: calc((42 - 41) * var(--u));
      background: linear-gradient(180deg, #3d3d3f 0%, #1d1d20 100%);
      box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(255, 255, 255, .10), 0 calc(2 * var(--u)) calc(14 * var(--u)) rgba(0, 0, 0, .28);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      transition: filter .18s ease, transform .1s ease;
    }

    .cta span {
      transform: translateY(calc(2 * var(--u)));
    }

    .cta:hover {
      filter: brightness(1.16);
    }

    .cta:active {
      transform: translateY(1px);
    }

    /* BURGER & MOBILE SHEET (Hidden on Desktop) */
    #menu { display: none; }
    .burger { display: none; }
    .sheet { display: none; }

    /* HERO */
    main.hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--hero-gap) * var(--vu));
      padding-bottom: calc(4 * var(--vu));
    }

    .h1 {
      font-family: var(--font-display);
      font-size: calc(var(--h1-fs) * var(--u));
      font-weight: var(--w-display);
      line-height: 1.10;
      letter-spacing: var(--display-ls);
      color: #fff;
      font-variation-settings: "opsz" 32;
      text-shadow: 0 calc(2 * var(--u)) calc(22 * var(--u)) rgba(0, 0, 0, .30);
      text-align: center;
    }

    /* COMPOSER CARD */
    .card {
      width: calc(var(--card-w) * var(--u));
      height: calc(var(--card-h) * var(--u));
      border-radius: calc(var(--card-r) * var(--u));
      margin-right: calc(3 * var(--u));
      background: rgba(41, 41, 43, .955);
      backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
      -webkit-backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
      box-shadow: inset 0 0 0 1px rgba(214, 228, 255, .14), 0 calc(22 * var(--u)) calc(60 * var(--u)) rgba(0, 0, 0, .30);
      position: relative;
    }

    .ph {
      position: absolute;
      left: calc(27 * var(--u));
      top: calc(33 * var(--u));
      right: calc(24 * var(--u));
      color: #8B8C8E;
      font-size: calc(var(--ph-fs) * var(--u));
      font-weight: var(--w-body);
      line-height: 1.35;
      letter-spacing: var(--body-ls);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* TOOLBAR */
    .tools {
      position: absolute;
      left: calc(19 * var(--u));
      top: calc(92 * var(--u));
      height: calc(30 * var(--u));
      right: calc(-1 * var(--u));
    }

    .chips {
      display: flex;
      align-items: center;
      gap: calc(var(--chip-gap) * var(--u));
      height: 100%;
    }

    .chip {
      height: calc(var(--chip-h) * var(--u));
      border-radius: calc(var(--chip-r) * var(--u));
      font-size: calc(var(--chip-fs) * var(--u));
      font-weight: var(--w-label);
      color: #909093;
      line-height: 1;
      background: linear-gradient(180deg, rgba(255, 255, 255, .088) 0%, rgba(255, 255, 255, .050) 45%, rgba(255, 255, 255, .038) 100%);
      border: 1px solid rgba(255, 255, 255, .05);
      padding: 0 calc(var(--pl, 12) * var(--u));
      display: inline-flex;
      align-items: center;
      gap: calc(var(--ig, 3.7) * var(--u));
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
      white-space: nowrap;
    }

    .chip:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .07));
      color: #c8c8cb;
    }

    .chip span {
      transform: translateY(calc(2 * var(--u)));
    }

    /* RIGHT CLUSTER */
    .right {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .right > * {
      position: absolute;
      pointer-events: auto;
    }

    .model {
      left: calc(510.2 * var(--u));
      top: calc(15.5 * var(--u));
      font-size: calc(var(--son-fs) * var(--u));
      font-weight: var(--w-model);
      color: #98999C;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      gap: calc(var(--chev-gap) * var(--u));
      cursor: pointer;
      letter-spacing: var(--model-ls);
    }

    .model .chev {
      width: calc(6.8 * var(--u));
    }

    .attach {
      left: calc(599.15 * var(--u));
      top: calc(10.14 * var(--u));
      color: #A9AAAD;
      cursor: pointer;
      transition: color .18s ease;
    }

    .attach svg {
      width: calc(19.79 * var(--u));
      height: auto;
    }

    .attach:hover {
      color: #fff;
    }

    .send {
      left: calc(640 * var(--u));
      top: calc(2 * var(--u));
      width: calc(var(--send-d) * var(--u));
      height: calc(var(--send-d) * var(--u));
      border-radius: 50%;
      background: linear-gradient(163deg, #FBBC94 0%, #F49D70 46%, #E88654 100%);
      box-shadow: 0 calc(3 * var(--u)) calc(12 * var(--u)) rgba(210, 110, 60, .34);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: filter .18s ease, transform .1s ease;
    }

    .send svg {
      width: calc(11.66 * var(--u));
      height: auto;
      color: #fff;
    }

    .send:hover {
      filter: brightness(1.07);
    }

    .send:active {
      transform: scale(.95);
    }

    /* FOOTER */
    footer.proof {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(52.3 * var(--vu));
    }

    .proof-caption {
      font-family: var(--font-display);
      font-size: calc(var(--by-fs) * var(--u));
      font-weight: var(--w-proof);
      letter-spacing: var(--proof-ls);
      color: rgba(255, 255, 255, .95);
      font-variation-settings: "opsz" 32;
      text-shadow: 0 calc(1 * var(--u)) calc(12 * var(--u)) rgba(0, 0, 0, .35);
    }

    .logos {
      display: flex;
      align-items: center;
      gap: calc(var(--logo-gap) * var(--u));
      color: #fff;
      filter: drop-shadow(0 calc(1 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, .30));
    }

    .logo-google svg { width: calc(96.84 * var(--u)); height: auto; }
    .logo-cisco svg { width: calc(67.29 * var(--u)); height: auto; }
    .logo-adobe svg { width: calc(88.68 * var(--u)); height: auto; }

    /* ANIMATIONS */
    @keyframes e-settle-down {
      from { opacity: 0; transform: translateY(calc(-5 * var(--u))); }
      to { opacity: 1; transform: none; }
    }
    @keyframes e-settle-up {
      from { opacity: 0; transform: translateY(calc(6 * var(--u))); }
      to { opacity: 1; transform: none; }
    }
    @keyframes e-mark {
      from { opacity: 0; transform: scale(.9); }
      to { opacity: 1; transform: none; }
    }
    @keyframes e-focus {
      from { opacity: 0; transform: translateY(calc(14 * var(--u))); filter: blur(calc(6 * var(--u))); }
      to { opacity: 1; transform: none; filter: blur(0); }
    }
    @keyframes e-panel {
      from { opacity: 0; transform: translateY(calc(18 * var(--u))) scale(.985); }
      to { opacity: 1; transform: none; }
    }
    @keyframes e-populate {
      from { opacity: 0; transform: translateY(calc(4 * var(--u))); }
      to { opacity: 1; transform: none; }
    }
    @keyframes e-send {
      from { opacity: 0; transform: scale(.82); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: no-preference) {
      html.anim .brand { animation: e-settle-down .58s var(--e-soft) .06s both; }
      html.anim .mark { animation: e-mark .62s var(--e-primary) .06s both; }
      html.anim .links a:nth-child(1) { animation: e-settle-down .50s var(--e-soft) .16s both; }
      html.anim .links a:nth-child(2) { animation: e-settle-down .50s var(--e-soft) .21s both; }
      html.anim .links a:nth-child(3) { animation: e-settle-down .50s var(--e-soft) .26s both; }
      html.anim .links a:nth-child(4) { animation: e-settle-down .50s var(--e-soft) .31s both; }
      html.anim .cta { animation: e-settle-down .55s var(--e-soft) .34s both; }
      html.anim .h1 { animation: e-focus 1.00s var(--e-primary) .30s both; will-change: transform, opacity; }
      html.anim .card { animation: e-panel .90s var(--e-primary) .62s both; will-change: transform, opacity; }
      html.anim .ph { animation: e-populate .50s var(--e-soft) .88s both; }
      html.anim .chips { animation: e-populate .50s var(--e-soft) .94s both; }
      html.anim .model { animation: e-populate .50s var(--e-soft) 1.00s both; }
      html.anim .attach { animation: e-populate .50s var(--e-soft) 1.00s both; }
      html.anim .send { animation: e-send .50s var(--e-primary) 1.00s both; }
      html.anim .proof-caption { animation: e-settle-up .55s var(--e-soft) 1.08s both; }
      html.anim .logo-google { animation: e-settle-up .55s var(--e-soft) 1.16s both; }
      html.anim .logo-cisco { animation: e-settle-up .55s var(--e-soft) 1.22s both; }
      html.anim .logo-adobe { animation: e-settle-up .55s var(--e-soft) 1.28s both; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }

    /* 2) TABLET ARCHITECTURE (600–1180 wide AND height >= 600) */
    @media (min-width: 600px) and (max-width: 1180px) and (min-height: 600px) {
      :root { --u: 1px; }
      .frame {
        padding: clamp(24px, 3.4vh, 44px) clamp(28px, 4.2vw, 60px) clamp(26px, 4.4vh, 56px);
      }
      .nav { height: auto; }
      .brand { gap: 10px; }
      .mark { width: 30px; height: 30px; }
      .wordmark { font-size: 17px; }
      .links {
        position: static;
        transform: none;
        gap: clamp(18px, 2.5vw, 36px);
      }
      .links a { font-size: clamp(14px, 1.6vw, 18px); }
      .cta {
        width: auto;
        height: 38px;
        padding: 0 16px;
        font-size: 14px;
        margin-top: 0;
        align-self: center;
      }
      .h1 {
        font-size: clamp(27px, 4.3vw, 44px);
        line-height: 1.12;
      }
      .card {
        width: min(100%, clamp(516px, 74vw, 760px));
        height: auto;
        margin-right: 0;
        padding: clamp(15px, 1.9vw, 24px);
        border-radius: clamp(17px, 2.1vw, 26px);
        display: flex;
        flex-direction: column;
        gap: clamp(20px, 3.2vh, 44px);
      }
      .ph {
        position: static;
        white-space: normal;
        font-size: clamp(11px, 1.35vw, 14px);
        line-height: 1.4;
      }
      .tools {
        position: static;
        height: auto;
        display: flex;
        flex-direction: row;
        align-items: center;
        flex-wrap: nowrap;
        gap: clamp(10px, 1.4vw, 18px);
      }
      .chips {
        flex-wrap: nowrap;
        gap: clamp(6px, 0.85vw, 10px);
      }
      .chip {
        width: auto;
        height: clamp(29px, 3.4vh, 34px);
        padding: 0 clamp(7px, 1vw, 13px);
        font-size: clamp(9.6px, 1.12vw, 12.5px);
      }
      .right {
        position: static;
        display: flex;
        align-items: center;
        margin-left: auto;
        gap: 0;
        inset: auto;
      }
      .right > * { position: static; }
      .model {
        font-size: clamp(9.8px, 1.12vw, 12.5px);
      }
      .attach {
        margin-left: clamp(9px, 1.4vw, 20px);
      }
      .attach svg {
        width: clamp(16px, 1.8vw, 20px);
      }
      .send {
        margin-left: clamp(9px, 1.3vw, 18px);
        width: clamp(32px, 3.5vw, 38px);
        height: clamp(32px, 3.5vw, 38px);
      }
      footer.proof {
        gap: clamp(15px, 2.5vh, 30px);
      }
      .proof-caption { font-size: 13px; }
      .logos { gap: clamp(24px, 4vw, 48px); }
      .logo-google svg { width: clamp(65px, 8vw, 85px); }
      .logo-cisco svg { width: clamp(45px, 5.5vw, 60px); }
      .logo-adobe svg { width: clamp(60px, 7.5vw, 80px); }
    }

    /* 3) COMPACT ARCHITECTURE (max-width: 599px OR height < 600px) */
    @media (max-width: 599px), (max-height: 599px) and (max-width: 1180px) {
      :root { --u: 1px; }
      .frame {
        padding:
          max(18px, env(safe-area-inset-top))
          max(clamp(18px, 5.2vw, 40px), env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(clamp(18px, 5.2vw, 40px), env(safe-area-inset-left));
      }
      .links, header.nav .cta { display: none; }
      .burger {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: rgba(255, 255, 255, .10);
        border: 1px solid rgba(255, 255, 255, .14);
        cursor: pointer;
        color: #fff;
      }
      /* Mobile Menu Sheet */
      .sheet {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.32s cubic-bezier(.4, 0, .2, 1);
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        z-index: 50;
      }
      #menu:checked ~ .sheet {
        grid-template-rows: 1fr;
      }
      .sheet-inner {
        overflow: hidden;
      }
      .sheet-panel {
        background: rgba(24, 24, 27, .86);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, .09);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .sheet-panel a {
        color: #fff;
        text-decoration: none;
        font-size: 15px;
        padding: 6px 0;
      }
      .sheet-panel .sheet-cta {
        height: 40px;
        border-radius: 11px;
        font-size: 15px;
        font-weight: 520;
        background: linear-gradient(180deg, #3d3d3f 0%, #1d1d20 100%);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 6px;
      }
      .mark { width: 30px; height: 30px; }
      .wordmark { font-size: 17px; }
      .h1 {
        width: 100%;
        max-width: 15ch;
        font-size: clamp(29px, 7.6vw, 50px);
        line-height: 1.14;
        letter-spacing: -.012em;
      }
      .card {
        width: 100%;
        max-width: 600px;
        height: auto;
        margin-right: 0;
        padding: clamp(13px, 3.4vw, 18px);
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        gap: clamp(16px, 4.6vh, 34px);
      }
      .ph {
        position: static;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: clamp(9.4px, 2.95vw, 14px);
      }
      .tools {
        position: static;
        height: auto;
        display: flex;
        flex-direction: column;
        align-items: stretch;
