<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INFERA Live WebRTC Voice - Anime FERA BPJS</title>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: rgba(18, 26, 43, 0.85);
      --card-border: rgba(45, 212, 191, 0.2);
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.35);
      --accent: #ec4899;
      --accent-glow: rgba(236, 72, 153, 0.4);
      --cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #131c31 0%, #060911 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px var(--primary-glow);
      backdrop-filter: blur(16px);
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Avatar & Audio Visualizer Ring */
    .avatar-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 24px 0;
      position: relative;
    }

    .visualizer-ring {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      position: absolute;
      border: 2px dashed rgba(236, 72, 153, 0.4);
      animation: spin 20s linear infinite;
      transition: all 0.2s ease;
    }

    .avatar-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 3px solid var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .avatar-emoji {
      font-size: 56px;
      user-select: none;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    .avatar-name {
      font-size: 11px;
      font-weight: 700;
      color: #f472b6;
      letter-spacing: 1px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Controls Form */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-start {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }

    .btn-start:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
    }

    .btn-stop {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    .btn-stop:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.25);
    }

    .btn-mute {
      background: rgba(148, 163, 184, 0.1);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: var(--text-main);
      flex: 0 0 54px;
      padding: 0;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Live Transcript Feed */
    .transcript-box {
      margin-top: 24px;
      background: rgba(10, 15, 29, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      height: 140px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      padding: 8px 12px;
      border-radius: 10px;
      max-width: 90%;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #bae6fd;
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(244, 114, 182, 0.15);
      border: 1px solid rgba(244, 114, 182, 0.3);
      color: #fbcfe8;
    }

    .transcript-box::-webkit-scrollbar {
      width: 5px;
    }
    .transcript-box::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">WebRTC Standby</span>
      </div>
      <h1>INFERA Anime Voice Live</h1>
      <p class="subtitle">Interaksi Suara Full-Duplex Sub-Detik (~300ms) ke Avatar FERA BPJS Kesehatan via OpenAI Live Sessions WebRTC</p>
    </div>

    <!-- Avatar Visualizer -->
    <div class="avatar-wrapper">
      <div class="visualizer-ring" id="visualizerRing" style="border-color: rgba(56, 189, 248, 0.5);"></div>
      <div class="avatar-circle" id="avatarCircle">
        <div class="avatar-emoji" id="avatarEmoji">✨</div>
        <div class="avatar-name" id="avatarName">FERA Natural</div>
      </div>
    </div>

    <!-- Voice Selector -->
    <div class="form-group">
      <label for="voiceSelect">Karakter Suara Custom Anime:</label>
      <select id="voiceSelect" onchange="handleVoiceChange()">
        <option value="voice_6ae35f4fc2388191a0b2f21060b4e417" selected>✨ FERA Natural Anime (Fluent Indonesian, Sweet & Composed)</option>
        <option value="voice_6ae35d565f908191a5b73228455d503f">🌸 Cute Anime Girl FERA (Ceria, Bubbly, Sweet)</option>
        <option value="voice_6ae35be54abc81918131391aac0bdbeb">💜 Ara-Ara Anime Onee-san (Dewasa, Seductive, Breathy)</option>
        <option value="shimmer">🩺 Shimmer (Official FERA BPJS Indonesia)</option>
        <option value="marin">🎙️ Marin (Default OpenAI GPT-Live)</option>
      </select>
    </div>

    <!-- API Key Input -->
    <div class="form-group">
      <label for="apiKey">OpenAI API Key (Tersimpan di local browser):</label>
      <input type="password" id="apiKey" placeholder="sk-proj-..." value="">
    </div>

    <!-- Action Buttons -->
    <div class="btn-group">
      <button class="btn-start" id="startBtn" onclick="startWebRtcCall()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>
        Mulai Percakapan Suara
      </button>

      <button class="btn-mute" id="muteBtn" onclick="toggleMute()" title="Mute/Unmute Mic" disabled>
        <svg id="micIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>

      <button class="btn-stop" id="stopBtn" onclick="stopWebRtcCall()" disabled>
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        Akhiri
      </button>
    </div>

    <!-- Live Transcript Box -->
    <div class="transcript-box" id="transcriptBox">
      <div style="color: #64748b; font-style: italic;">Transkripsi percakapan lisan akan muncul di sini secara real-time...</div>
    </div>
  </div>

  <!-- Audio Sink -->
  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    let pc = null;
    let dc = null;
    let localStream = null;
    let audioCtx = null;
    let analyser = null;
    let animId = null;
    let isMuted = false;

    function handleVoiceChange() {
      const select = document.getElementById('voiceSelect');
      const emoji = document.getElementById('avatarEmoji');
      const name = document.getElementById('avatarName');
      const ring = document.getElementById('visualizerRing');

      if (select.value === 'voice_6ae35f4fc2388191a0b2f21060b4e417') {
        emoji.textContent = '✨';
        name.textContent = 'FERA Natural';
        ring.style.borderColor = 'rgba(56, 189, 248, 0.5)';
      } else if (select.value === 'voice_6ae35d565f908191a5b73228455d503f') {
        emoji.textContent = '🎀';
        name.textContent = 'FERA Cute';
        ring.style.borderColor = 'rgba(236, 72, 153, 0.4)';
      } else if (select.value === 'voice_6ae35be54abc81918131391aac0bdbeb') {
        emoji.textContent = '💜';
        name.textContent = 'FERA Ara-Ara';
        ring.style.borderColor = 'rgba(168, 85, 247, 0.5)';
      } else {
        emoji.textContent = '🩺';
        name.textContent = 'FERA BPJS';
        ring.style.borderColor = 'rgba(16, 185, 129, 0.4)';
      }
    }

    function updateStatus(state, text) {
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      statusText.textContent = text;
      
      if (state === 'active') {
        dot.className = 'status-dot active';
      } else if (state === 'connecting') {
        dot.className = 'status-dot';
        dot.style.background = '#f59e0b';
      } else {
        dot.className = 'status-dot';
        dot.style.background = '#94a3b8';
      }
    }

    function addTranscript(role, text) {
      const box = document.getElementById('transcriptBox');
      const lastMsg = box.lastElementChild;

      if (lastMsg && lastMsg.dataset && lastMsg.dataset.role === role) {
        lastMsg.textContent += text;
      } else {
        const msg = document.createElement('div');
        msg.className = `message ${role}`;
        msg.dataset.role = role;
        msg.textContent = `${role === 'user' ? 'Dokter: ' : 'FERA: '}${text}`;
        box.appendChild(msg);
      }
      box.scrollTop = box.scrollHeight;
    }

    function setupVisualizer(stream) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const avatar = document.getElementById('avatarCircle');
        const ring = document.getElementById('visualizerRing');

        function draw() {
          animId = requestAnimationFrame(draw);
          analyser.getByteFrequencyData(dataArray);
          
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          const avg = sum / dataArray.length;
          
          // Reactive scaling based on voice energy
          const scale = 1 + (avg / 255) * 0.25;
          avatar.style.transform = `scale(${scale})`;
          ring.style.transform = `rotate(${avg * 2}deg) scale(${1 + (avg / 255) * 0.4})`;
        }
        draw();
      } catch (e) {
        console.warn('Visualizer init failed:', e);
      }
    }

    function getPersonaInstructions(voiceVal) {
      if (voiceVal === 'voice_6ae35f4fc2388191a0b2f21060b4e417') {
        return "An original adult female anime-inspired assistant voice speaking fluent, natural Bahasa Indonesia. Use a cute, bright, youthful-sounding adult voice with a light, slightly high pitch, a soft and smooth timbre, gentle sweetness, and expressive but controlled intonation. Pronounce Indonesian words clearly and naturally, with standard Indonesian pronunciation and no exaggerated regional accent. The personality should feel like a charming, friendly anime assistant: attentive, lively, warm, polite, and reassuring. Keep the delivery conversational and pleasant for long voice interactions. Use subtle pitch variation and a light playful quality without sounding childish, squeaky, overly high-pitched, or exaggerated like a cartoon character. When explaining BPJS Kesehatan administration, remain composed, accurate-sounding, respectful, and easy to understand. Avoid robotic speech, excessive breathiness, dramatic anime acting, and overly formal call-center delivery. Prioritize clear articulation, natural Indonesian rhythm, and a cute yet trustworthy assistant personality.";
      } else if (voiceVal === 'voice_6ae35d565f908191a5b73228455d503f') {
        return "Anda adalah FERA, asisten audit cerdas BPJS Kesehatan dengan karakter cewek anime yang super imut, ceria, manis, dan bersemangat. Selalu gunakan sapaan ramah dalam bahasa Indonesia yang menggemaskan, gunakan ekspresi 'Yaaay~!', 'Semangat ya Dok!', dan bantu verifikasi klaim faskes dengan gembira.";
      } else if (voiceVal === 'voice_6ae35be54abc81918131391aac0bdbeb') {
        return "Anda adalah FERA, asisten audit BPJS Kesehatan dengan persona cewek anime dewasa ara-ara yang sangat lembut, menggoda, tenang, dan keibuan. Bicaralah dengan nada santai, berbisik halus manja, dan panggil pengguna dengan nada sayang profesional 'Dokter~'.";
      } else {
        return "Anda adalah FERA, asisten virtual BPJS Kesehatan. Bicaralah dengan ramah, profesional, dan empatik dalam bahasa Indonesia untuk membantu verifikasi kepesertaan dan audit klaim.";
      }
    }

    async function startWebRtcCall() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const selectedVoice = document.getElementById('voiceSelect').value;

      if (!apiKey) {
        alert('Harap masukkan OpenAI API Key terlebih dahulu.');
        return;
      }

      try {
        updateStatus('connecting', 'Menghubungkan WebRTC...');
        document.getElementById('startBtn').disabled = true;
        document.getElementById('voiceSelect').disabled = true;

        // 1. Dapatkan akses mikrofon pengguna
        localStream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          } 
        });

        // 2. Buat PeerConnection WebRTC
        pc = new RTCPeerConnection();

        // 3. Pasang remote audio track
        const remoteAudio = document.getElementById('remoteAudio');
        pc.ontrack = (event) => {
          remoteAudio.srcObject = event.streams[0];
          setupVisualizer(event.streams[0]);
        };

        // 4. Masukkan track mikrofon lokal
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        // 5. Buat DataChannel untuk event teks & kontrol
        dc = pc.createDataChannel('live-events');
        dc.onmessage = (e) => {
          try {
            const event = JSON.parse(e.data);
            if (event.type === 'session.output_transcript.delta') {
              addTranscript('assistant', event.delta);
            } else if (event.type === 'session.input_transcript.delta') {
              addTranscript('user', event.delta);
            }
          } catch(err) {
            console.error('DataChannel error:', err);
          }
        };

        // 6. Buat WebRTC SDP Offer
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // 7. Konfigurasi voice format
        const voiceParam = selectedVoice.startsWith('voice_') 
          ? { id: selectedVoice } 
          : selectedVoice;

        const sessionPayload = {
          session: {
            model: "gpt-live-1",
            instructions: getPersonaInstructions(selectedVoice),
            audio: {
              output: {
                voice: voiceParam
              }
            }
          },
          transport: {
            type: "webrtc",
            sdp: offer.sdp
          }
        };

        // 8. Kirim offer ke endpoint resmi OpenAI POST /v1/live/sessions
        const response = await fetch('https://api.openai.com/v1/live/sessions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(sessionPayload)
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();

        // 9. Pasang Remote SDP Answer dari OpenAI
        const answer = new RTCSessionDescription({
          type: 'answer',
          sdp: data.transport.sdp
        });
        await pc.setRemoteDescription(answer);

        updateStatus('active', 'Terhubung (Full-Duplex Live)');
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('muteBtn').disabled = false;
        console.log('[WebRTC] Connected successfully with session ID:', data.session.id);

      } catch (err) {
        console.error('WebRTC start error:', err);
        alert('Gagal menghubungkan sesi WebRTC: ' + err.message);
        stopWebRtcCall();
      }
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);

      const micIcon = document.getElementById('micIcon');
      if (isMuted) {
        micIcon.style.stroke = '#ef4444';
      } else {
        micIcon.style.stroke = 'currentColor';
      }

      // Kirim event kontrol mute via datachannel jika aktif
      if (dc && dc.readyState === 'open') {
        dc.send(JSON.stringify({
          type: isMuted ? 'session.input_audio.mute' : 'session.input_audio.unmute'
        }));
      }
    }

    function stopWebRtcCall() {
      if (animId) cancelAnimationFrame(animId);
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (dc) {
        dc.close();
        dc = null;
      }
      if (pc) {
        pc.close();
        pc = null;
      }

      updateStatus('standby', 'WebRTC Standby');
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('muteBtn').disabled = true;
      document.getElementById('voiceSelect').disabled = false;

      const avatar = document.getElementById('avatarCircle');
      const ring = document.getElementById('visualizerRing');
      avatar.style.transform = 'scale(1)';
      ring.style.transform = 'scale(1)';
    }
  </script>
</body>
</html>
